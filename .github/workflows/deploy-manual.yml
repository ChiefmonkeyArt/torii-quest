name: Deploy to VPS (manual)

# ADR-0106: NEVER force-update. Deploys are manual-only.
#
# This replaces the ADR-0101/0105 pipeline that auto-deployed on every tag push.
# The commit → tag step (tag-release.yml) is unchanged, but nothing is shipped to
# any VPS without an explicit human action. Run this workflow by hand — via the
# GitHub Actions "Run workflow" button with an optional tag, or leave the tag
# blank to deploy main's current package.json version.
#
# Note: this workflow targets the OWNER's canonical instance only (a single SSH
# host secret). Self-hosted Torii Suite instances are never touched by CI — their
# owners opt in through the in-game "Update available" button.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v0.2.749-alpha). Blank deploys main HEAD.'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: torii-quest-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve tag to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(gh api "repos/${{ github.repository }}/contents/package.json?ref=${{ github.ref_name }}" --jq '.content' | base64 -d | jq -r '.version')
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "::error::Could not resolve version from package.json on ${{ github.ref_name }}" >&2
              exit 1
            fi
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger VPS update service over SSH
        env:
          SSH_KEY: ${{ secrets.TORII_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.TORII_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "Missing TORII_DEPLOY_SSH_KEY or TORII_DEPLOY_HOST secret." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/torii-deploy
          chmod 600 ~/.ssh/torii-deploy
          ssh-keyscan -t ed25519 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Forced-command on the VPS side ignores any command we send; the
          # server runs /usr/local/bin/torii-deploy-hook and streams journal
          # output back as stdout.
          ssh -i ~/.ssh/torii-deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              ubuntu@"$SSH_HOST"

      - name: Verify live version matches tag
        env:
          TARGET_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Give the update service a moment to finish the symlink swap.
          # Scope the match to the #ver footer label specifically — a bare
          # page-wide grep matches a stale changelog-comment version string,
          # which previously reported failure on a deploy that had succeeded.
          for i in 1 2 3 4 5 6 7 8; do
            live=$(curl -sf https://chiefmonkey.art/quest/ | grep -oE '<div id="ver">v0\.2\.[0-9]+-alpha' | grep -oE 'v0\.2\.[0-9]+-alpha' || true)
            echo "poll $i: live=$live tag=${TARGET_TAG}"
            if [ "$live" = "${TARGET_TAG}" ]; then
              echo "live version matches tag: $live"
              exit 0
            fi
            sleep 10
          done
          echo "Live version never matched ${TARGET_TAG} after 80s of polling." >&2
          exit 1