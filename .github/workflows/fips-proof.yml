name: FIPS two-node proof
on:
  pull_request:
    paths: ['server/presence/fipsPresence.js', 'tests/fips-presence.test.js', 'tools/*fips*', '.github/workflows/fips-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download and verify pinned upstream binary
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 120 \
            https://github.com/jmcorgan/fips/releases/download/v0.5.1/fips_0.5.1_amd64.deb -o /tmp/fips.deb
          echo '5ac8a8d1defadd460b013fcec6b0393a08579b797b42aa76646dc6935815becb  /tmp/fips.deb' | sha256sum -c -
          dpkg-deb -x /tmp/fips.deb /tmp/fips
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables libdbus-1-3
          sudo modprobe tun
      - name: Firewall policy from matching Suite branch
        uses: actions/checkout@v4
        with:
          repository: ChiefmonkeyArt/torii-suite
          ref: 6e9ecffbc510a729fee8c52188b5d7c6b93a0f9e
          path: suite-proof
      - name: Actual FIPS heartbeat exchange, outage, recovery and firewall
        run: |
          set -euo pipefail
          sudo "$(command -v node)" tools/prove-fips-two-node.mjs \
            /tmp/fips/usr/bin/fips /tmp/fips/usr/bin/fipsctl suite-proof/fips/mesh.nft | tee /tmp/fips-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: fips-two-node-proof
          path: /tmp/fips-proof.json
